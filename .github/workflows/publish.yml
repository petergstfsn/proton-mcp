name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    # The fork does not own the upstream npm package or trusted publisher.
    if: github.repository == 'googlarz/proton-mail-bridge-client'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # Trusted Publishing exchanges this job's OIDC token for a short-lived
      # publish token — no NPM_TOKEN secret, so classic-token 2FA/EOTP
      # prompts (which blocked every publish since v1.13.8) can't happen.
      # Requires npm CLI >=11.5.1; setup-node's bundled npm may be older.
      - name: Update npm for Trusted Publishing support
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Publish
        run: npm publish
