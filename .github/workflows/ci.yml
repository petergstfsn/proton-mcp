name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Check release metadata
        run: npm run check:release-metadata

      - name: Lint types
        run: npm run lint

      - name: Run test suite
        run: npm test

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t proton-mail-bridge-client:ci .
      - name: Verify runtime imports and native SQLite
        run: |
          docker run --rm --entrypoint node proton-mail-bridge-client:ci --input-type=module -e "await import('./dist/index.js'); const {default: Database} = await import('better-sqlite3'); new Database(':memory:').close()"
